name: Release

on:
  push:
    tags: ['v*']

permissions:
  # The workflow creates the GitHub release for the tag it was pushed with.
  contents: write
  # Provenance is signed with the workflow's OIDC token, so publishing needs it.
  id-token: write
  # Publishing the mirror to npm.pkg.github.com needs it.
  packages: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with package.json would publish the wrong version.
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package

      # Pre-1.0 releases go to the alpha tag, matching SECURITY.md. Access has
      # to be explicit: provenance is refused for a new package without it.
      - run: pnpm publish --tag alpha --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # GitHub Packages only accepts scoped names, so the mirror is published
      # as @express-zod/core while npmjs keeps the unscoped name. This also
      # puts the package in the repository's sidebar.
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pkg set name="@express-zod/core"
          printf '@express-zod:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' \
            "$NODE_AUTH_TOKEN" >> .npmrc
          pnpm publish --tag alpha --access public --no-git-checks

      # Only after a successful publish, so a failed release leaves no page
      # pointing at a version that npm never received.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease
          fi
