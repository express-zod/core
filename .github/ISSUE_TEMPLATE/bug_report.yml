name: Bug report
description: Something behaves differently from what the docs say.
title: "[Bug]: "
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for the report. A minimal reproduction is the single thing
              that gets a bug fixed fastest.

              Do not report security vulnerabilities here — see
              [SECURITY.md](../blob/main/SECURITY.md).

    - type: textarea
      id: what-happened
      attributes:
          label: What happened
          description: Include the actual error or output, verbatim.
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: What you expected instead
      validations:
          required: true

    - type: textarea
      id: reproduction
      attributes:
          label: Minimal reproduction
          description: A link to a repo or a code snippet that reproduces it.
          render: ts
      validations:
          required: true

    - type: input
      id: version
      attributes:
          label: express-zod version
          placeholder: 0.0.3-alpha.1
      validations:
          required: true

    - type: input
      id: environment
      attributes:
          label: Environment
          description: Node version, package manager, and OS.
          placeholder: Node 24.16.0, pnpm 10.34.4, Windows 11
      validations:
          required: true
